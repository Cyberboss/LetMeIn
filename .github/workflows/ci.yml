name: "CI"

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

concurrency:
  group: "build-${{ github.head_ref || github.run_id }}-${{ github.event_name }}"
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
            dotnet-version: '10.0.x'

      - name: Checkout
        uses: actions/checkout@v7

      - name: Build
        run: dotnet build -c Release

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: contains(github.event.head_commit.message, '[Deploy]') && github.event_name == 'push'
    permissions:
      id-token: write
      attestations: write
      artifact-metadata: write
      contents: write
    steps:
      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
            dotnet-version: '10.0.x'

      - name: Checkout
        uses: actions/checkout@v7

      - name: Publish
        run: dotnet publish -o publish /nowarn:NETSDK1194

      - name: Get Project File Name
        id: find_file
        shell: bash
        run: |
          FILE_PATH=$(find . -maxdepth 3 -name "*.csproj" -print -quit)
          FILE_NAME=$(basename "$FILE_PATH")

          echo "Found project name: $FILE_PATH"

          echo "filename=$FILE_NAME" >> "$GITHUB_OUTPUT"

      - name: Extract SemVer from Output
        id: get_version
        shell: bash
        run: |
          DLL_PATH="./publish/${{ steps.find_file.outputs.filename }}.dll"

          # 2. Extract AssemblyInformationalVersionAttribute using strings
          # Modern .NET embeds the string matching the format: "AssemblyInformationalVersionAttribute\0<version>"
          RAW_VERSION=$(strings "$DLL_PATH" | grep -A 1 "AssemblyInformationalVersionAttribute" | tail -n 1)

          # 3. Clean up the version string (removes commit hashes appended by modern .NET SDKs)
          SEMVER=$(echo "$RAW_VERSION" | cut -d'+' -f1 | tr -d '[:space:]')

          echo "Extracted SemVer: $SEMVER"

          echo "version=$SEMVER" >> "$GITHUB_OUTPUT"

      - name: Attest
        uses: actions/attest@v4.2.2
        with:
          subject-path: 'publish/${{ steps.find_file.outputs.filename }}.dll'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: v${{  steps.get_version.outputs.version }}
          name: ${{ steps.find_file.outputs.filename }} v${{  steps.get_version.outputs.version }}
          files: |
            ./publish/${{ steps.find_file.outputs.filename }}.dll
          body_path: RELEASE_NOTES.md
          target_commitish: ${{ github.event.head_commit.id }}
          make_latest: true
